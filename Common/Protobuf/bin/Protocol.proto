syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
	string name = 1;
}

message S_LOGIN
{
	bool success = 1;
	Player player = 2;
}

message C_MATCH_START
{
	Position primaryPosition = 1;
	Position secondaryPosition = 2;
}

message S_MATCH_QUEUED
{

}

message C_MATCH_CANCEL
{

}

message S_MATCH_CANCELED
{

}

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}