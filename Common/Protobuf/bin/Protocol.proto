syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
	string name = 1;
}

message S_LOGIN
{
	bool success = 1;
	Player player = 2;
}

message C_MATCH_START
{
	Position primaryPosition = 1;
	Position secondaryPosition = 2;
}

message S_MATCH_QUEUED
{

}

message S_MATCH_FOUND
{
	uint64 matchId = 1;
	repeated PlayerInfo myTeam = 2;
	repeated PlayerInfo enemyTeam = 3;
	Position myPosition = 4;
}

message C_MATCH_ACCEPT
{

}

message C_MATCH_DECLINE
{

}

message S_CHAMPSELECT_START
{
	uint64 matchId = 1;
	repeated PlayerInfo participants = 2;
}

message C_PICK_CHAMPION
{
	uint32 championId = 1;
}

message S_PICK_UPDATE
{
	uint64 playerId = 1;
	uint32 championId = 2;
}

message S_PICK_FAILED
{

}

message S_GAME_START
{
	uint64 matchId = 1;
	repeated PlayerInfo finalTeams = 2;
}

message C_MATCH_CANCEL
{

}

message S_MATCH_CANCELED
{

}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}